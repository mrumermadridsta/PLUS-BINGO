<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLUS BINGO - Ultra Pro</title>
    <style>
        :root {
            --primary: #ff4757;
            --primary-hover: #ff6b81;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --accent: #2ed573;
            --gold: #ffa500;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #1e1b4b 0%, #311042 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid var(--primary);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--text-light);
            text-shadow: 0 0 10px var(--primary);
            letter-spacing: 2px;
        }

        /* Main Game Layout */
        .game-container {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        /* Left Side: History & Analytics */
        .left-panel {
            flex: 1;
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: 75vh;
        }

        /* Right Side: Interactive Board */
        .right-panel {
            flex: 2.5;
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Screens */
        .screen { display: none; }
        .screen.active { display: flex; flex-direction: column; gap: 20px; width: 100%; }

        /* Lobby Style */
        .lobby-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .room-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .room-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.2);
        }

        .room-card h3 { font-size: 1.8rem; color: var(--gold); margin-bottom: 10px; }
        .room-card p { color: #94a3b8; font-size: 0.9rem; }

        /* Numbers Grid (1-400) */
        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(55px, 1fr));
            gap: 8px;
            overflow-y: auto;
            max-height: 50vh;
            padding-right: 5px;
        }

        .num-cell {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.2s;
        }

        .num-cell.drawn {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 0 8px var(--primary);
            animation: pop 0.3s ease-out;
        }

        /* History Log */
        .history-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            background-color: #0f172a;
            padding: 10px;
            border-left: 4px solid var(--accent);
            border-radius: 4px;
            font-weight: 500;
        }

        /* Control Panel */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: auto;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #475569; cursor: not-allowed; }

        .current-display {
            font-size: 5rem;
            font-weight: 900;
            color: var(--accent);
            text-align: center;
            text-shadow: 0 0 20px rgba(46, 213, 115, 0.4);
            margin: 20px 0;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <header>
        <h1>PLUS BINGO</h1>
    </header>

    <div class="game-container">
        <!-- LEFT PANEL: History Logs -->
        <div class="left-panel">
            <h2>የወጡ ቁጥሮች ታሪክ</h2>
            <hr style="border-color: #334155;">
            <ul id="historyList" class="history-list">
                <li style="color: #64748b; text-align: center; margin-top: 20px;">እስካሁን የወጣ ቁጥር የለም</li>
            </ul>
        </div>

        <!-- RIGHT PANEL: Main Interactive View -->
        <div class="right-panel">
            
            <!-- 1. Lobby Screen -->
            <div id="lobbyScreen" class="screen active">
                <h2>የመጫወቻ ክፍል ይምረጡ</h2>
                <div class="lobby-grid">
                    <div class="room-card" onclick="joinRoom(5)">
                        <h3>5 Birr</h3>
                        <p>የመግቢያ ክፍያ</p>
                    </div>
                    <div class="room-card" onclick="joinRoom(10)">
                        <h3>10 Birr</h3>
                        <p>የመግቢያ ክፍያ</p>
                    </div>
                    <div class="room-card" onclick="joinRoom(50)">
                        <h3>50 Birr</h3>
                        <p>የመግቢያ ክፍያ</p>
                    </div>
                    <div class="room-card" onclick="joinRoom(100)">
                        <h3>100 Birr</h3>
                        <p>የመግቢያ ክፍያ</p>
                    </div>
                </div>
            </div>

            <!-- 2. Game Board Screen -->
            <div id="gameScreen" class="screen">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2 id="roomTitle">ክፍል: -</h2>
                    <span id="syncedBadge" style="background-color: var(--accent); color: #0f172a; padding: 5px 10px; border-radius: 20px; font-weight: bold; font-size: 0.8rem;">የቀን የተመሳሰለ (Synced)</span>
                </div>

                <div class="current-display" id="currentNumber">-</div>

                <!-- 1 to 400 Number Matrix -->
                <div class="numbers-grid" id="numbersGrid"></div>

                <div class="controls">
                    <button id="drawBtn" onclick="requestDraw()">ቁጥር አውጣ</button>
                    <button style="background-color: #475569;" onclick="leaveRoom()">ከክፍል ውጣ</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Production Server URL directly pointing to your Render app
        const SERVER_URL = "https://plus-bingo.onrender.com";
        
        let currentRoom = null;
        let drawnNumbers = new Set();

        // Initialize 1-400 Grid
        const grid = document.getElementById('numbersGrid');
        for (let i = 1; i <= 400; i++) {
            const cell = document.createElement('div');
            cell.className = 'num-cell';
            cell.id = `cell-${i}`;
            cell.innerText = i;
            grid.appendChild(cell);
        }

        function joinRoom(amount) {
            currentRoom = amount;
            document.getElementById('roomTitle').innerText = `ክፍል: ${amount} Birr`;
            document.getElementById('lobbyScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');
            resetBoard();
        }

        function leaveRoom() {
            currentRoom = null;
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('lobbyScreen').classList.add('active');
        }

        function resetBoard() {
            drawnNumbers.clear();
            document.getElementById('currentNumber').innerText = "-";
            document.getElementById('historyList').innerHTML = "";
            document.querySelectorAll('.num-cell').forEach(cell => {
                cell.className = 'num-cell';
            });
        }

        function requestDraw() {
            // Simulated local action / Hooked up to server broadcast for synced game
            if(drawnNumbers.size >= 400) {
                alert("ሁሉም ቁጥሮች ወጥተዋል!");
                return;
            }

            let nextNum;
            do {
                nextNum = Math.floor(Math.random() * 400) + 1;
            } while (drawnNumbers.has(nextNum));

            handleNewNumber(nextNum);
        }

        function handleNewNumber(num) {
            drawnNumbers.add(num);
            
            // UI Updates
            document.getElementById('currentNumber').innerText = num;
            
            const cell = document.getElementById(`cell-${num}`);
            if(cell) cell.classList.add('drawn');

            // Update History List
            const historyList = document.getElementById('historyList');
            if(drawnNumbers.size === 1) historyList.innerHTML = "";
            
            const li = document.createElement('li');
            li.className = 'history-item';
            li.innerText = `ቁጥር ${num} ወጥቷል`;
            historyList.insertBefore(li, historyList.firstChild);

            // High-End Voice Calling Synthesis
            speakNumber(num);
        }

        function speakNumber(num) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop current speech
                const utterance = new SpeechSynthesisUtterance(`Number ${num}`);
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
