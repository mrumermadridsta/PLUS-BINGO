<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLUS BINGO</title>
    <style>
        :root {
            --primary-color: #ffcc00;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #ffffff;
            --accent-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ሎቢ / መግቢያ ገፅ */
        #lobby-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
        }

        .lobby-title {
            font-size: 3.5rem;
            color: var(--primary-color);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 25px rgba(255, 204, 0, 0.5);
            font-weight: 900;
        }

        .lobby-subtitle {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 40px;
        }

        .rooms-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            max-width: 600px;
            width: 100%;
        }

        .room-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .room-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
            box-shadow: 0 15px 30px rgba(255, 204, 0, 0.2);
        }

        .room-amount {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .room-label {
            color: #94a3b8;
            font-size: 1rem;
            text-transform: uppercase;
        }

        /* ዋናው የጨዋታ ገፅታ (በግራና ቀኝ የተከፈለ Flex አቀማመጥ) */
        #game-screen {
            display: none;
            flex-direction: row;
            flex: 1;
            height: 100vh;
            overflow: hidden;
        }

        /* የግራ ክፍል - ታሪክ ማሳያ (History Log) */
        .left-panel {
            width: 320px;
            background-color: #111827;
            border-right: 2px solid #1f2937;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .panel-title {
            font-size: 1.3rem;
            color: var(--primary-color);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #374151;
            text-transform: uppercase;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        .history-item {
            background-color: #1f2937;
            border-left: 4px solid var(--primary-color);
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* የቀኝ ክፍል - የቁጥር ሰሌዳ (Interactive Cards) */
        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-dark);
            padding: 25px;
            overflow-y: auto;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background-color: var(--card-bg);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .game-info-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .drawn-display {
            font-size: 3.5rem;
            font-weight: bold;
            color: #00ff66;
            background-color: #0f172a;
            padding: 10px 30px;
            border-radius: 10px;
            border: 2px solid #00ff66;
            min-width: 120px;
            text-align: center;
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
        }

        /* ከ1 እስከ 400 የቁጥር ካርዶች ማትሪክስ */
        .matrix-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
            gap: 10px;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #334155;
            flex: 1;
        }

        .number-card {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: #64748b;
            transition: all 0.2s ease;
        }

        .number-card.active {
            background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%);
            color: #0f172a;
            border-color: #fff;
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(255, 204, 0, 0.4);
        }

        .controls-bar {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn-action {
            background: linear-gradient(135deg, #2ed573 0%, #26af5f 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(46, 213, 115, 0.4);
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(46, 213, 115, 0.6);
        }

        .btn-leave {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4);
            transition: all 0.2s ease;
        }
    </style>
</head>
<body>

    <!-- ሎቢ / መግቢያ ገፅ -->
    <div id="lobby-screen">
        <h1 class="lobby-title">PLUS BINGO</h1>
        <p class="lobby-subtitle">ክፍል ይምረጡና ጨዋታውን ይቀላቀሉ</p>
        <div class="rooms-container">
            <div class="room-card" onclick="enterRoom(5)">
                <div class="room-amount">5 Birr</div>
                <div class="room-label">መደበኛ ክፍል</div>
            </div>
            <div class="room-card" onclick="enterRoom(10)">
                <div class="room-amount">10 Birr</div>
                <div class="room-label">ታዋቂ ክፍል</div>
            </div>
            <div class="room-card" onclick="enterRoom(50)">
                <div class="room-amount">50 Birr</div>
                <div class="room-label">ከፍተኛ ክፍል</div>
            </div>
            <div class="room-card" onclick="enterRoom(100)">
                <div class="room-amount">100 Birr</div>
                <div class="room-label">ቪአይፒ ክፍል</div>
            </div>
        </div>
    </div>

    <!-- ዋናው የጨዋታ ገፅታ -->
    <div id="game-screen">
        <!-- የግራ ታሪክ ሰሌዳ -->
        <div class="left-panel">
            <h2 class="panel-title">የወጡ ቁጥሮች ታሪክ</h2>
            <div class="history-list" id="historyList"></div>
        </div>

        <!-- የቀኝ ዋና ሰሌዳ -->
        <div class="main-panel">
            <div class="game-header">
                <div>
                    <div class="game-info-title" id="roomTitle">ክፍል: 5 Birr</div>
                    <div style="color: #94a3b8; margin-top: 5px;">የቀጥታ ጨዋታ (Synced)</div>
                </div>
                <div class="drawn-display" id="currentDrawn">--</div>
            </div>

            <!-- ከ1 እስከ 400 ቁጥሮች ማውጫ ማትሪክስ -->
            <div class="matrix-container" id="matrixContainer"></div>

            <div class="controls-bar">
                <button class="btn-action" onclick="requestDraw()">ቁጥር አውጣ</button>
                <button class="btn-leave" onclick="exitToLobby()">ከክፍል ውጣ</button>
            </div>
        </div>
    </div>

    <script>
        const SERVER_URL = "https://plus-bingo.onrender.com"; 
        let currentRoom = 5;
        let drawnNumbers = new Set();

        // ከ1 እስከ 400 ካርዶችን መፍጠሪያ
        const matrixContainer = document.getElementById('matrixContainer');
        for (let i = 1; i <= 400; i++) {
            const card = document.createElement('div');
            card.className = 'number-card';
            card.id = `num-${i}`;
            card.innerText = i;
            matrixContainer.appendChild(card);
        }

        function enterRoom(amount) {
            currentRoom = amount;
            document.getElementById('roomTitle').innerText = `PLUS BINGO - ክፍል: ${amount} Birr`;
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            resetBoard();
        }

        function exitToLobby() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'flex';
            resetBoard();
        }

        // Voice component - ቁጥር ሲወጣ በድምፅ ማስታወቂያ ማድረጊያ
        function speakNumber(num) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(`Number ${num}`);
                msg.rate = 1.0;
                window.speechSynthesis.speak(msg);
            }
        }

        function requestDraw() {
            if(drawnNumbers.size >= 400) {
                alert("ሁሉም ቁጥሮች ወጥተዋል!");
                return;
            }

            let nextNum;
            do {
                nextNum = Math.floor(Math.random() * 400) + 1;
            } while (drawnNumbers.has(nextNum));

            handleNewNumber(nextNum);
        }

        function handleNewNumber(num) {
            drawnNumbers.add(num);
            document.getElementById('currentDrawn').innerText = num;
            speakNumber(num);

            const card = document.getElementById(`num-${num}`);
            if (card) {
                card.classList.add('active');
                
                const historyList = document.getElementById('historyList');
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `<span>ቁጥር እጣ</span> <strong style="color:#ffcc00; font-size:1.2rem;">${num}</strong>`;
                historyList.insertBefore(item, historyList.firstChild);
            }
        }

        function resetBoard() {
            drawnNumbers.clear();
            document.getElementById('currentDrawn').innerText = '--';
            document.getElementById('historyList').innerHTML = '';
            document.querySelectorAll('.number-card').forEach(card => {
                card.classList.remove('active');
            });
        }
    </script>
</body>
</html>
